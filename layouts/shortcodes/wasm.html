{{ $jsFile := .Get 0 | default "index.js" }}
{{ $width := (.Get 1) | default (.Get "width") | default "800px" }}
{{ $height := (.Get 2) | default (.Get "height") | default "600px" }}
{{ $wasmFile := replace $jsFile ".js" "_bg.wasm" }}

<div id="wasm-frame-{{ $jsFile }}" style="width: 100%; max-width: {{ $width }}; height: {{ $height }}; border: 2px solid #ddd; border-radius: 8px; margin: 20px auto; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; position: relative;">
  <div id="wasm-loading-{{ $jsFile }}" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #666;">
    <div style="font-size: 18px; margin-bottom: 10px;">Loading WebAssembly...</div>
    <div style="width: 40px; height: 4px; background: #f0f0f0; border-radius: 2px; margin: 0 auto; overflow: hidden;">
      <div id="wasm-progress-{{ $jsFile }}" style="width: 0%; height: 100%; background: #4CAF50; transition: width 0.3s ease;"></div>
    </div>
  </div>
</div>

<script type="module">
  (function() {
    const wasmPath = './dist';
    const jsFile = wasmPath + '/{{ $jsFile }}';
    const wasmFile = wasmPath + '/{{ $wasmFile }}';
    const frameId = 'wasm-frame-{{ $jsFile }}';
    const loadingId = 'wasm-loading-{{ $jsFile }}';
    const progressId = 'wasm-progress-{{ $jsFile }}';
    
    function loadWasm() {
      // Simulate loading progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 30;
        if (progress > 90) progress = 90;
        const progressBar = document.getElementById(progressId);
        if (progressBar) {
          progressBar.style.width = progress + '%';
        }
      }, 200);
      
      import(jsFile)
        .then(module => {
          const init = module.default || module.init;
          if (typeof init === 'function') {
            return init({ module_or_path: wasmFile });
          } else {
            throw new Error('No init function found');
          }
        })
        .then(wasm => {
          clearInterval(progressInterval);
          const progressBar = document.getElementById(progressId);
          if (progressBar) {
            progressBar.style.width = '100%';
          }
          
          // Hide loading and show WASM content
          setTimeout(() => {
            const loading = document.getElementById(loadingId);
            const frame = document.getElementById(frameId);
            
            // Move any canvas or content created by WASM into our frame
            const canvas = document.querySelector('canvas');
            if (canvas && frame) {
              // Force canvas to match frame dimensions
              const rect = frame.getBoundingClientRect();
              canvas.width = rect.width;
              canvas.height = rect.height;
              
              // Override any inline styles that WGPU might set
              canvas.style.setProperty('width', '100%', 'important');
              canvas.style.setProperty('height', '100%', 'important');
              canvas.style.setProperty('display', 'block', 'important');
              canvas.style.setProperty('position', 'absolute', 'important');
              canvas.style.setProperty('top', '0', 'important');
              canvas.style.setProperty('left', '0', 'important');
              canvas.style.setProperty('margin', '0', 'important');
              canvas.style.setProperty('padding', '0', 'important');
              
              frame.style.position = 'relative';
              frame.appendChild(canvas);
              
              // Monitor for canvas size changes and override them
              const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                  if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                    canvas.style.setProperty('width', '100%', 'important');
                    canvas.style.setProperty('height', '100%', 'important');
                  }
                });
              });
              
              observer.observe(canvas, { attributes: true, attributeFilter: ['style'] });
            }
            
            // Hide loading indicator
            if (loading) {
              loading.style.display = 'none';
            }
            
            // Dispatch event for WASM applications that listen for it
            dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
          }, 500);
        })
        .catch(error => {
          clearInterval(progressInterval);
          console.error('Failed to load WASM:', error);
          showError('Failed to load WebAssembly: ' + error.message);
        });
    }
    
    function showError(message) {
      const loading = document.getElementById(loadingId);
      if (loading) {
        loading.innerHTML = `
          <div style="color: #d32f2f; text-align: center; padding: 20px;">
            <div style="font-size: 16px; margin-bottom: 10px;">❌ ${message}</div>
            <div style="font-size: 12px; color: #666;">Please check the browser console for more details.</div>
          </div>
        `;
      }
    }
    
    // Start loading immediately
    loadWasm();
  })();
</script>
